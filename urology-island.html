<title>泌尿島聖誕夜</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;700&display=swap">
<style>
/* Layout: full-bleed night-sky WebGL archipelago; title top-left, greeting card under the title, island chips + controls pinned bottom. Single deliberate night theme. */
:root{
  --sky-top:#06122b; --sky-bot:#1b3a63;
  --snow:#f3f7ff; --ink:#dfe9ff; --muted:#9fb4d8;
  --holly:#c8323c; --gold:#f2c14e;
  --glass:rgba(9,22,48,.66); --line:rgba(242,193,78,.55);
  --f-display:"LXGW WenKai TC","Kaiti TC","STKaiti","DFKai-SB",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;overflow:hidden;background:linear-gradient(180deg,var(--sky-top) 0%,#0d2347 55%,var(--sky-bot) 100%);background-color:var(--sky-top);color:var(--ink);font-family:var(--f-body)}
#stage{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none}
.top{position:fixed;top:0;left:0;right:0;padding-top:calc(env(safe-area-inset-top,0px) + 12px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.brand h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:clamp(28px,6.5vw,44px);letter-spacing:.08em;color:var(--snow);text-shadow:0 0 18px rgba(242,193,78,.45)}
.brand h1 span{color:var(--gold)}
.brand p{margin:2px 0 0;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.stamp{font-family:var(--f-display);font-size:13px;color:var(--gold);border:1px solid var(--line);border-radius:4px;padding:4px 8px;transform:rotate(4deg);background:rgba(200,50,60,.18);white-space:nowrap}
.greet{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 108px);transform:translate(-50%,-10px);width:min(calc(100vw - 32px),500px);box-sizing:border-box;padding:12px 18px 14px;text-align:center;background:var(--glass);border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 36px rgba(0,0,0,.35),inset 0 0 0 3px var(--isl,rgba(200,50,60,.35));opacity:0;transition:opacity .6s ease,transform .6s cubic-bezier(.2,.9,.3,1.3);cursor:pointer}
.greet.show{opacity:1;transform:translate(-50%,0)}
.greet .head{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:4px}
.greet .em{font-size:28px;line-height:1}
.greet .isl{font-size:12px;letter-spacing:.14em;color:var(--snow);padding:3px 10px;border-radius:999px;background:var(--isl,#c8323c)}
.greet .l1,.greet .l2{margin:0;font-family:var(--f-display);font-size:clamp(21px,5.4vw,30px);line-height:1.4;text-wrap:balance}
.greet .l1{color:var(--snow)}
.greet .l2{color:var(--gold);font-weight:700}
.bar{position:fixed;left:0;right:0;bottom:0;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 12px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.chips{display:flex;gap:6px;flex-wrap:nowrap;justify-content:center;pointer-events:auto}
.chips button{font:inherit;font-size:13px;color:var(--snow);background:var(--glass);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:6px clamp(7px,2.2vw,11px);cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap}
@media (max-width:460px){.chips{gap:4px}.chips button{font-size:clamp(11px,3.2vw,13px);border-bottom:2px solid var(--c)}.chips button i{display:none}}
.chips button i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.chips button[aria-current="true"]{border-color:var(--c);box-shadow:0 0 12px var(--c)}
.ctrls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;pointer-events:auto}
.ctrls button{font:inherit;font-size:14px;color:var(--snow);background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer}
.ctrls button[aria-pressed="true"]{background:rgba(200,50,60,.55)}
button:focus-visible,.greet:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.nw{white-space:nowrap}
.hint{font-size:11px;color:var(--muted);letter-spacing:.06em}

.fallback{position:fixed;left:16px;right:16px;top:50%;text-align:center;color:var(--muted)}
</style>

<canvas id="stage" aria-label="泌尿群島 3D 動畫：腎臟島、輸尿管島、膀胱島、攝護腺島、尿道島以水管橋相連，聖誕老人駕麋鹿雪橇依序盤旋各島"></canvas>

<header class="top">
  <div class="brand">
    <h1>泌尿<span>群島</span></h1>
    <p>Urology Islands · <span class="nw">Merry Christmas 2026</span></p>
  </div>
  <div class="stamp">泌尿科聖誕特輯</div>
</header>

<div class="greet show" id="greet" role="button" tabindex="0" aria-live="polite" aria-label="飛往下一座島">
  <div class="head"><span class="em" id="gEm">🎄</span><span class="isl" id="gIsl">腎臟島</span></div>
  <p class="l1" id="gL1">耶誕大餐有滋味，</p>
  <p class="l2" id="gL2">結石別來湊一咖！</p>
</div>

<nav class="bar">
  <div class="chips" id="chips"></div>
  <div class="ctrls">
    <button id="btnView" aria-pressed="false">看全景</button>
    <button id="btnSpin" aria-pressed="true">暫停旋轉</button>
    <button id="btnMusic" aria-pressed="false">播放鈴聲</button>
  </div>
  <div class="hint">點島名讓聖誕老人飛過去 · 拖曳旋轉 · 雙指縮放</div>
</nav>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
/* ---------- Islands & greetings (flow order: kidney → ureter → bladder → prostate → urethra) ---------- */
const ISL=[
  {name:'腎臟島',en:'KIDNEY',color:'#e0505a',hex:0xe0505a,em:'🎄',l1:'耶誕大餐有滋味，',l2:'結石別來湊一咖！'},
  {name:'輸尿管島',en:'URETER',color:'#5cc4ff',hex:0x5cc4ff,em:'🎅',l1:'聖誕老人走煙囪，',l2:'祝你尿路一路通！'},
  {name:'膀胱島',en:'BLADDER',color:'#f2c14e',hex:0xf2c14e,em:'🦌',l1:'紅鼻麋鹿來報到，',l2:'急尿頻尿都放掉！'},
  {name:'攝護腺島',en:'PROSTATE',color:'#b48cff',hex:0xb48cff,em:'🌟',l1:'天增歲月人增壽，',l2:'攝護腺不會年年增！'},
  {name:'尿道島',en:'URETHRA',color:'#4fd08a',hex:0x4fd08a,em:'🎁',l1:'今年交換禮物，',l2:'明年不換尿布！'}
];
const greet=document.getElementById('greet'),gEm=document.getElementById('gEm'),gIsl=document.getElementById('gIsl'),gL1=document.getElementById('gL1'),gL2=document.getElementById('gL2'),chips=document.getElementById('chips');
let flyTo=()=>{};
ISL.forEach((s,i)=>{const b=document.createElement('button');b.style.setProperty('--c',s.color);b.innerHTML='<i></i>'+s.name;b.onclick=()=>flyTo(i);chips.appendChild(b);});
function markChip(i){[...chips.children].forEach((d,k)=>d.setAttribute('aria-current',k===i?'true':'false'));}
function paint(i){const s=ISL[i];gEm.textContent=s.em;gIsl.textContent=s.name+' · '+s.en;gL1.textContent=s.l1;gL2.textContent=s.l2;greet.style.setProperty('--isl',s.color);markChip(i);}
function showGreet(i){paint(i);greet.classList.add('show');}
function hideGreet(){greet.classList.remove('show');}
let curIsland=0;
greet.addEventListener('click',()=>flyTo((curIsland+1)%5));
greet.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flyTo((curIsland+1)%5);}});
paint(0);

if(typeof THREE==='undefined'){const d=document.createElement('p');d.className='fallback';d.textContent='3D 場景載入失敗，請檢查網路後重新整理。';document.body.appendChild(d);return;}
const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- Renderer ---------- */
const canvas=document.getElementById('stage');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputEncoding=THREE.sRGBEncoding;renderer.localClippingEnabled=true;
const scene=new THREE.Scene();scene.fog=new THREE.Fog(0x0d2347,70,170);
const camera=new THREE.PerspectiveCamera(45,1,.1,400);
const controls=new THREE.OrbitControls(camera,canvas);
controls.enableDamping=true;controls.dampingFactor=.07;controls.autoRotate=!reduce;controls.autoRotateSpeed=.45;
controls.minDistance=10;controls.maxDistance=140;controls.maxPolarAngle=1.48;controls.enablePan=false;
scene.add(new THREE.HemisphereLight(0xbcd4ff,0x1c2a44,.65));
const moonLight=new THREE.DirectionalLight(0xd6e4ff,.9);moonLight.position.set(-20,40,18);moonLight.castShadow=true;
moonLight.shadow.mapSize.set(2048,2048);Object.assign(moonLight.shadow.camera,{left:-34,right:34,top:34,bottom:-34,near:1,far:110});scene.add(moonLight);

const V=(x,y,z)=>new THREE.Vector3(x,y,z);
const M=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.8,metalness:0},o));
function mesh(geo,mat,x,y,z,parent,shadow=true){const m=new THREE.Mesh(geo,mat);m.position.set(x||0,y||0,z||0);if(shadow){m.castShadow=true;m.receiveShadow=true;}(parent||scene).add(m);return m;}
const snowMat=M(0xf3f7ff,{roughness:.95});
function dotTex(){const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d');const g=x.createRadialGradient(32,32,0,32,32,32);g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(.35,'rgba(255,255,255,.75)');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(0,0,64,64);return new THREE.CanvasTexture(c);}
const DOT=dotTex();
function label(text,parent,x,y,z,h,accent,big){
  const c=document.createElement('canvas'),ctx=c.getContext('2d'),fs=big?64:52,font='700 '+fs+'px "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif';
  ctx.font=font;const w=Math.ceil(ctx.measureText(text).width)+60,hh=big?104:90;c.width=w;c.height=hh;ctx.font=font;
  const r=hh/2-4;ctx.beginPath();ctx.moveTo(r+3,3);ctx.lineTo(w-r-3,3);ctx.arc(w-r-3,hh/2,r,-Math.PI/2,Math.PI/2);ctx.lineTo(r+3,hh-3);ctx.arc(r+3,hh/2,r,Math.PI/2,Math.PI*1.5);ctx.closePath();
  ctx.fillStyle=big?accent:'rgba(8,20,44,.85)';ctx.fill();ctx.lineWidth=big?6:4;ctx.strokeStyle=big?'#f3f7ff':accent;ctx.stroke();
  ctx.fillStyle=big?'#08142c':'#f3f7ff';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(text,w/2,hh/2+3);
  const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=4;
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true,depthWrite:false}));s.scale.set(h*w/hh,h,1);s.position.set(x,y,z);s.renderOrder=5;parent.add(s);return s;
}

/* ---------- Sky ---------- */
(function(){const n=800,p=new Float32Array(n*3);for(let i=0;i<n;i++){const u=Math.random()*Math.PI*2,v=Math.random()*Math.PI*.5,r=180;p[i*3]=r*Math.sin(v)*Math.cos(u);p[i*3+1]=r*Math.cos(v)*.8+4;p[i*3+2]=r*Math.sin(v)*Math.sin(u);}
const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(p,3));scene.add(new THREE.Points(g,new THREE.PointsMaterial({size:1.4,map:DOT,transparent:true,depthWrite:false,color:0xfff6dd,fog:false})));})();
const moon=mesh(new THREE.SphereGeometry(7,32,32),new THREE.MeshBasicMaterial({color:0xfff3c8,fog:false}),-70,60,-120,scene,false);
const halo=new THREE.Sprite(new THREE.SpriteMaterial({map:DOT,color:0xffe9a8,transparent:true,opacity:.45,depthWrite:false,fog:false}));halo.scale.set(42,42,1);halo.position.copy(moon.position);scene.add(halo);
const SN=1800,snowPos=new Float32Array(SN*3),snowSpd=new Float32Array(SN);
for(let i=0;i<SN;i++){snowPos[i*3]=(Math.random()-.5)*90;snowPos[i*3+1]=Math.random()*50-14;snowPos[i*3+2]=(Math.random()-.5)*90;snowSpd[i]=.6+Math.random()*1.2;}
const snowGeo=new THREE.BufferGeometry();snowGeo.setAttribute('position',new THREE.BufferAttribute(snowPos,3));
scene.add(new THREE.Points(snowGeo,new THREE.PointsMaterial({size:.24,map:DOT,transparent:true,depthWrite:false,color:0xffffff})));

/* ---------- Island bases (pentagon) ---------- */
const RING=21,IR=6.4,TOP=.6;
const C=ISL.map((s,k)=>{const a=-Math.PI/2+k*Math.PI*2/5;return V(Math.cos(a)*RING,0,Math.sin(a)*RING);});
const angTo=(i,j)=>Math.atan2(C[j].z-C[i].z,C[j].x-C[i].x);
const P=(a,r,y)=>V(Math.cos(a)*r,y===undefined?TOP:y,Math.sin(a)*r);
const hash=(x,y,z)=>{const s=Math.sin(Math.round(x*50)*12.9898+Math.round(y*50)*78.233+Math.round(z*50)*37.719)*43758.5453;return s-Math.floor(s);};
const groups=[],garlands=[],nameTags=[];
ISL.forEach((s,k)=>{
  const g=new THREE.Group();g.position.copy(C[k]);scene.add(g);groups.push(g);
  mesh(new THREE.CylinderGeometry(IR,IR-.15,.5,64),snowMat,0,.35,0,g);
  mesh(new THREE.CylinderGeometry(IR-.15,IR-.6,.8,64),M(0x6b4a33),0,-.3,0,g);
  const cg=new THREE.ConeGeometry(IR-.6,7,26,6);cg.rotateX(Math.PI);const a=cg.attributes.position;
  for(let i=0;i<a.count;i++){const x=a.getX(i),y=a.getY(i),z=a.getZ(i);if(y>3.4)continue;const q=.75+hash(x+k,y,z)*.5;a.setXYZ(i,x*q,y+(hash(z,x+k,y)-.5)*.6,z*q);}
  cg.computeVertexNormals();mesh(cg,M(0x4d5a73,{flatShading:true,roughness:1}),0,-4.2,0,g);
  const ice=M(0xcfe8ff,{roughness:.2,metalness:.1,transparent:true,opacity:.85});
  for(let i=0;i<44;i++){const an=i/44*Math.PI*2,len=.25+Math.random()*.7;const c=mesh(new THREE.ConeGeometry(.08,len,5),ice,Math.cos(an)*(IR-.08),.1-len/2,Math.sin(an)*(IR-.08),g,false);c.rotation.x=Math.PI;}
  /* garland of lights in the island colour */
  const gm=new THREE.MeshStandardMaterial({color:s.hex,emissive:s.hex,emissiveIntensity:.6});
  for(let i=0;i<40;i++){const an=i/40*Math.PI*2;mesh(new THREE.SphereGeometry(.1,8,6),gm,Math.cos(an)*(IR-.05),.62,Math.sin(an)*(IR-.05),g,false);}
  garlands.push(gm);
  nameTags.push(label(s.name,g,0,8.2,0,1.25,s.color,true));
});
/* pines near the outer rim */
function pines(k,angles){angles.forEach(d=>{const a=Math.atan2(C[k].z,C[k].x)+d*Math.PI/180,r=IR-1.1,t=new THREE.Group();t.position.copy(P(a,r,TOP));const s=.5+Math.random()*.25;t.scale.setScalar(s);groups[k].add(t);
  mesh(new THREE.CylinderGeometry(.12,.15,.5,6),M(0x5a3a22),0,.25,0,t);mesh(new THREE.ConeGeometry(.9,1.6,10),M(0x2a7a4b),0,1.2,0,t);mesh(new THREE.ConeGeometry(.6,1.2,10),M(0x2f8f5b),0,2.0,0,t);mesh(new THREE.ConeGeometry(.3,.45,10),snowMat,0,2.55,0,t);});}
ISL.forEach((s,k)=>pines(k,k===0?[]:[-62,-30,30,62]));

/* ---------- Water network: tubes + peristalsis drops ---------- */
const waterMat=M(0x7fd3ff,{roughness:.15,metalness:.1,emissive:0x0b3a5c,transparent:true,opacity:.85});
const dropMat=new THREE.MeshStandardMaterial({color:0xfff1a6,emissive:0x8a6a10,roughness:.3});
const flows=[];
function tube(pts,r,parent,nDrops,speed){const c=new THREE.CatmullRomCurve3(pts);mesh(new THREE.TubeGeometry(c,Math.max(40,pts.length*14),r,10,false),waterMat,0,0,0,parent,false);
  for(let i=0;i<nDrops;i++){const m=mesh(new THREE.SphereGeometry(r*1.25,10,8),dropMat,0,0,0,parent,false);flows.push({m,c,o:i/nDrops,s:speed});}return c;}
/* bridges between neighbouring islands (world space); kidney→ureter→bladder are paired (left + right ureter) */
const BR=[];const loc=(k,v)=>v.clone().sub(C[k]);
for(let k=0;k<4;k++){const a=angTo(k,k+1),b=angTo(k+1,k);const A0=C[k].clone().add(P(a,IR-.4,.66)),B0=C[k+1].clone().add(P(b,IR-.4,.66));
  const D=B0.clone().sub(A0),N=V(-D.z,0,D.x).normalize(),sides=k<2?[-.75,.75]:[0];BR[k]={A:{},B:{},N};
  sides.forEach(sd=>{const A=A0.clone().addScaledVector(N,sd),B=B0.clone().addScaledVector(N,sd);BR[k].A[sd]=A;BR[k].B[sd]=B;
    const mid=A.clone().lerp(B,.5);mid.y=3.2;const A2=A.clone().lerp(B,.2);A2.y=2.2;const B2=A.clone().lerp(B,.8);B2.y=2.2;
    tube([A,A2,mid,B2,B],k<2?.22:.3,scene,k<2?7:9,.09);});
  /* candy-cane posts beside each bridge end */
  const po=k<2?1.45:.8;[A0,B0].forEach(p=>[-po,po].forEach(o=>{const q=p.clone().addScaledVector(N,o);const post=new THREE.Group();post.position.set(q.x,TOP,q.z);scene.add(post);for(let i=0;i<5;i++)mesh(new THREE.CylinderGeometry(.11,.11,.28,10),M(i%2?0xffffff:0xc8323c),0,.14+i*.28,0,post);}));
}
const updaters=[],twinkles=[],smokes=[],legs=[],spinners=[];
/* reindeer builder (used by sleigh and bladder island) */
function reindeer(parent,x,y,z,rudolph,animate){
  const g=new THREE.Group();g.position.set(x,y,z);parent.add(g);const fur=M(0x8b5a2b,{roughness:.9});
  const b=mesh(new THREE.SphereGeometry(.4,16,12),fur,0,0,0,g);b.scale.set(.75,.72,1.4);
  const nk=mesh(new THREE.CylinderGeometry(.12,.16,.5,8),fur,0,.32,.45,g);nk.rotation.x=.6;
  mesh(new THREE.SphereGeometry(.22,14,10),fur,0,.58,.65,g);mesh(new THREE.SphereGeometry(.13,12,8),M(0xa4744a),0,.52,.86,g);
  const nose=mesh(new THREE.SphereGeometry(rudolph?.1:.06,12,8),rudolph?new THREE.MeshStandardMaterial({color:0xff2a2a,emissive:0xff1010,emissiveIntensity:1.6}):M(0x111111),0,.55,.98,g,false);
  if(rudolph){const pl=new THREE.PointLight(0xff3030,1.3,7);pl.position.set(0,.55,1.2);g.add(pl);const gl=new THREE.Sprite(new THREE.SpriteMaterial({map:DOT,color:0xff4040,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending}));gl.scale.set(.9,.9,1);gl.position.copy(nose.position);g.add(gl);twinkles.push({glow:gl});}
  const ant=M(0xe8d3a8);[-1,1].forEach(s=>{const a=mesh(new THREE.CylinderGeometry(.025,.03,.45,6),ant,s*.12,.85,.6,g,false);a.rotation.z=-s*.5;const t=mesh(new THREE.CylinderGeometry(.02,.02,.22,6),ant,s*.24,.95,.66,g,false);t.rotation.z=s*.6;const e=mesh(new THREE.ConeGeometry(.06,.14,6),fur,s*.18,.7,.55,g,false);e.rotation.z=-s*1.2;});
  mesh(new THREE.SphereGeometry(.08,8,6),snowMat,0,.12,-.55,g,false);
  [[-.17,.35],[.17,.35],[-.17,-.35],[.17,-.35]].forEach(([lx,lz],i)=>{const p=new THREE.Group();p.position.set(lx,-.12,lz);g.add(p);mesh(new THREE.CylinderGeometry(.05,.04,.6,6),fur,0,-.3,0,p,false);mesh(new THREE.SphereGeometry(.05,6,5),M(0x2a1a10),0,-.6,0,p,false);if(animate)legs.push({p,ph:(i%2?Math.PI:0)+(lz>0?0:Math.PI/2)+z});});
  return g;
}
function sign(parent,x,z,text,color){const g=new THREE.Group();g.position.set(x,TOP,z);parent.add(g);mesh(new THREE.CylinderGeometry(.06,.06,1.4,8),M(0x6b4a33),0,.7,0,g);label(text,parent,x,TOP+2.0,z,.5,color);return g;}

  [[-.38,2.1],[.38,2.1],[-.38,3.4],[.38,3.4],[0,4.7]].forEach(([x,z],i)=>{reindeer(sleigh,x,.75,z,i===4,true);sleigh.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([V(0,.6,.85),V(x,.85,z+.3)]),new THREE.LineBasicMaterial({color:0xf2c14e})));});
  sleigh.scale.setScalar(1.25);
})();
const TR=360,trPos=new Float32Array(TR*3),trCol=new Float32Array(TR*3),trLife=new Float32Array(TR);let trI=0;
const trGeo=new THREE.BufferGeometry();trGeo.setAttribute('position',new THREE.BufferAttribute(trPos,3));trGeo.setAttribute('color',new THREE.BufferAttribute(trCol,3));
scene.add(new THREE.Points(trGeo,new THREE.PointsMaterial({size:.4,map:DOT,vertexColors:true,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending})));
const palette=[[1,.85,.4],[1,.5,.5],[.6,.9,1],[1,1,1]];

/* ---------- Tour: orbit each island, then fly to the next ---------- */
const ORB_R=9.5,ORB_H=5.5,OMEGA=.62;
const tan=th=>V(-Math.sin(th),0,Math.cos(th));
const orbitPt=(j,th)=>C[j].clone().add(V(Math.cos(th)*ORB_R,ORB_H,Math.sin(th)*ORB_R));
let tour,lastDir=V(1,0,0);
function startOrbit(j,th){const nx=(j+1)%5,te=angTo(j,nx);let sw=((te-th)%(Math.PI*2)+Math.PI*2)%(Math.PI*2);if(sw<Math.PI)sw+=Math.PI*2;tour={mode:'orbit',j,t:0,dur:sw/OMEGA,th0:th,sw};curIsland=j;showGreet(j);}
function startTravel(j){const P0=sleigh.position.clone(),c=C[j];const th=Math.atan2(P0.z-c.z,P0.x-c.x);const P3=orbitPt(j,th);const L=P0.distanceTo(P3)*.42;
  tour={mode:'travel',j,t:0,dur:Math.max(2.4,P0.distanceTo(P3)/9),P0,P1:P0.clone().addScaledVector(lastDir,L),P2:P3.clone().addScaledVector(tan(th),-L),P3,th};curIsland=j;markChip(j);hideGreet();}
flyTo=j=>startTravel(j);
function bez(a,b,c,d,u){const v=1-u;return a.clone().multiplyScalar(v*v*v).addScaledVector(b,3*v*v*u).addScaledVector(c,3*v*u*u).addScaledVector(d,u*u*u);}
sleigh.position.copy(orbitPt(0,Math.atan2(C[0].z,C[0].x)-.8));startOrbit(0,Math.atan2(C[0].z,C[0].x)-.8);
function tourStep(dt){tour.t+=dt;const u=Math.min(1,tour.t/tour.dur);let p;
  if(tour.mode==='orbit'){const th=tour.th0+tour.sw*u;p=orbitPt(tour.j,th);p.y+=Math.sin(th*3)*.8;if(u>=1)startTravel((tour.j+1)%5);}
  else{p=bez(tour.P0,tour.P1,tour.P2,tour.P3,u);p.y+=Math.sin(u*Math.PI)*3.5;if(u>=1){startOrbit(tour.j,tour.th);}}
  const d=p.clone().sub(sleigh.position);if(d.lengthSq()>1e-6){lastDir=V(d.x,0,d.z).normalize();sleigh.lookAt(p.clone().add(d));}
  sleigh.position.copy(p);sleigh.rotateZ(tour.mode==='orbit'?.22:0);}

/* ---------- Camera: follow island or whole archipelago ---------- */
function resize(){const w=window.innerWidth,h=window.innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
resize();window.addEventListener('resize',resize);
const asp=()=>window.innerWidth/window.innerHeight;
const followDist=()=>asp()<1?Math.min(62,27/asp()*.95):32, overviewDist=()=>asp()<1?Math.min(135,60/asp()*.95):74;
let overview=false,zoomGoal=null;const goal=V(0,1.5,0);
controls.target.copy(C[0]).setY(3);camera.position.copy(controls.target).add(V(0,.5,1).normalize().multiplyScalar(followDist()));
const btnView=document.getElementById('btnView');
btnView.onclick=()=>{overview=!overview;btnView.setAttribute('aria-pressed',String(overview));btnView.textContent=overview?'跟隨聖誕老人':'看全景';zoomGoal=overview?overviewDist():followDist();};
let userSpin=!reduce;const btnSpin=document.getElementById('btnSpin');const spinTxt=()=>{btnSpin.setAttribute('aria-pressed',String(userSpin));btnSpin.textContent=userSpin?'暫停旋轉':'開始旋轉';};spinTxt();
btnSpin.onclick=()=>{userSpin=!userSpin;spinTxt();};

/* ---------- Jingle Bells (synth) ---------- */
const btnMusic=document.getElementById('btnMusic');
const F={C:523.25,D:587.33,E:659.25,F:698.46,G:783.99};
const A=[['E',1],['E',1],['E',2],['E',1],['E',1],['E',2],['E',1],['G',1],['C',1.5],['D',.5],['E',4]];
const SONG=A.concat([['F',1],['F',1],['F',1.5],['F',.5],['F',1],['E',1],['E',1],['E',.5],['E',.5],['E',1],['D',1],['D',1],['E',1],['D',2],['G',2]],A,[['F',1],['F',1],['F',1],['F',1],['F',1],['E',1],['E',1],['E',.5],['E',.5],['G',1],['G',1],['F',1],['D',1],['C',4],['C',0]]);
const BEAT=.27;let actx=null,mOn=false,nextT=0,si=0,mTimer=null;
function tone(f,t,d,type,vol){const o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.012);g.gain.exponentialRampToValueAtTime(.0008,t+d);o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+d+.05);}
function tick(){while(nextT<actx.currentTime+.35){const [n,b]=SONG[si];const d=b*BEAT;if(b>0){tone(F[n],nextT,Math.max(d*.95,.2),'triangle',.16);tone(F[n]*2,nextT,.25,'sine',.05);}if(si%2===0)tone(2637,nextT,.09,'square',.012);nextT+=b>0?d:BEAT*2;si=(si+1)%SONG.length;}}
btnMusic.onclick=()=>{try{if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){btnMusic.textContent='此裝置不支援音效';return;}
  mOn=!mOn;btnMusic.setAttribute('aria-pressed',String(mOn));btnMusic.textContent=mOn?'停止鈴聲':'播放鈴聲';
  if(mOn){actx.resume();nextT=actx.currentTime+.05;si=0;mTimer=setInterval(tick,90);}else clearInterval(mTimer);};

/* ---------- Animate ---------- */
const clock=new THREE.Clock();let T=0;const SP=reduce?.5:1;const tmp=V(0,0,0),prevT=V(0,0,0);
function animate(){
  const dt=Math.min(clock.getDelta(),.05)*SP;T+=dt;
  for(let i=0;i<SN;i++){snowPos[i*3+1]-=snowSpd[i]*dt;snowPos[i*3]+=Math.sin(T+i)*.004;if(snowPos[i*3+1]<-14)snowPos[i*3+1]=34;}
  snowGeo.attributes.position.needsUpdate=true;
  flows.forEach(f=>{const u=(T*f.s+f.o)%1;f.c.getPointAt(u,f.m.position);f.m.position.y+=.05;f.m.scale.setScalar(.75+.45*Math.max(0,Math.sin(u*Math.PI*10-T*4)));});
  for(let i=0;i<WF;i++){wfVel[i*3+1]-=9.8*dt;wfPos[i*3]+=wfVel[i*3]*dt;wfPos[i*3+1]+=wfVel[i*3+1]*dt;wfPos[i*3+2]+=wfVel[i*3+2]*dt;if(wfPos[i*3+1]<-9)wfReset(i);}
  wfGeo.attributes.position.needsUpdate=true;
  smokes.forEach(s=>{const u=(T*.18+s.o)%1;s.m.position.set(.7+Math.sin(u*6+s.o*9)*.25*u,3.8+u*3.2,-.35+u*.6);s.m.scale.setScalar(.6+u*2.2);s.m.material.opacity=.55*(1-u);});
  twinkles.forEach(t=>{if(t.m)t.m.emissiveIntensity=.4+Math.max(0,Math.sin(T*3+t.i*1.7))*1.4;else{const s=.8+Math.sin(T*6)*.25;t.glow.scale.set(s,s,1);}});
  spinners.forEach(s=>s.rotation.y=T*.8);updaters.forEach(f=>f(T,dt));
  garlands.forEach((g,i)=>g.emissiveIntensity=i===curIsland?1.2+Math.sin(T*5)*.6:.35);
  nameTags.forEach((n,i)=>{const b=n.userData.base||(n.userData.base=n.scale.clone());const k=i===curIsland?1.15+Math.sin(T*3)*.05:1;n.scale.set(b.x*k,b.y*k,1);});
  tourStep(dt);controls.autoRotate=userSpin;
  legs.forEach(l=>{l.p.rotation.x=Math.sin(T*9+l.ph)*.7;});
  for(let q=0;q<3;q++){tmp.set((Math.random()-.5)*.8,.1+Math.random()*.3,-1.1);sleigh.localToWorld(tmp);const i=trI;trI=(trI+1)%TR;trPos[i*3]=tmp.x;trPos[i*3+1]=tmp.y;trPos[i*3+2]=tmp.z;trLife[i]=1;const c=palette[(Math.random()*4)|0];trCol[i*3]=c[0];trCol[i*3+1]=c[1];trCol[i*3+2]=c[2];}
  for(let i=0;i<TR;i++){if(trLife[i]<=0)continue;const f=Math.max(0,trLife[i]-dt*.5),r=f/trLife[i];trLife[i]=f;trCol[i*3]*=r;trCol[i*3+1]*=r;trCol[i*3+2]*=r;trPos[i*3+1]-=dt*.4;}
  trGeo.attributes.position.needsUpdate=true;trGeo.attributes.color.needsUpdate=true;
  /* camera target easing */
  if(overview)goal.set(0,0,2);else goal.copy(C[curIsland]).setY(3);
  prevT.copy(controls.target);controls.target.lerp(goal,Math.min(1,dt*1.6));camera.position.add(tmp.copy(controls.target).sub(prevT));
  if(zoomGoal!==null){const off=camera.position.clone().sub(controls.target);const d=off.length(),nd=d+(zoomGoal-d)*Math.min(1,dt*2.5);camera.position.copy(controls.target).add(off.setLength(nd));if(Math.abs(zoomGoal-nd)<.3)zoomGoal=null;}
  controls.update();renderer.render(scene,camera);requestAnimationFrame(animate);
}
animate();
})();
</script>
