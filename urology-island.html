<title>泌尿島聖誕夜</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;700&display=swap">
<style>
/* Layout: full-bleed night-sky WebGL stage; title top-left, greeting card floating at center, control bar pinned bottom. Single deliberate night theme. */
:root{
  --sky-top:#06122b; --sky-bot:#1b3a63;
  --snow:#f3f7ff; --ink:#dfe9ff; --muted:#9fb4d8;
  --holly:#c8323c; --gold:#f2c14e; --pine:#2f8f5b;
  --glass:rgba(9,22,48,.55); --line:rgba(242,193,78,.55);
  --f-display:"LXGW WenKai TC","Kaiti TC","STKaiti","DFKai-SB",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;overflow:hidden;background:linear-gradient(180deg,var(--sky-top) 0%,#0d2347 55%,var(--sky-bot) 100%);background-color:var(--sky-top);color:var(--ink);font-family:var(--f-body)}
#stage{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none}
.top{position:fixed;top:0;left:0;right:0;padding-top:calc(env(safe-area-inset-top,0px) + 14px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.brand h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:clamp(30px,7vw,46px);letter-spacing:.08em;color:var(--snow);text-shadow:0 0 18px rgba(242,193,78,.45)}
.brand h1 span{color:var(--gold)}
.brand p{margin:2px 0 0;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.stamp{font-family:var(--f-display);font-size:13px;color:var(--gold);border:1px solid var(--line);border-radius:4px;padding:4px 8px;transform:rotate(4deg);background:rgba(200,50,60,.18);white-space:nowrap}
.greet{position:fixed;left:50%;top:31%;transform:translate(-50%,-50%) scale(.92);width:min(88vw,520px);box-sizing:border-box;padding:18px 22px 20px;text-align:center;background:var(--glass);border:1px solid var(--line);border-radius:18px;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);box-shadow:0 10px 40px rgba(0,0,0,.35),inset 0 0 0 4px rgba(200,50,60,.25);opacity:0;transition:opacity .7s ease,transform .7s cubic-bezier(.2,.9,.3,1.3);cursor:pointer}
.greet.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.greet .em{font-size:40px;line-height:1;margin-bottom:6px;display:block}
.greet .l1,.greet .l2{margin:0;font-family:var(--f-display);font-size:clamp(22px,5.6vw,32px);line-height:1.45;text-wrap:balance}
.greet .l1{color:var(--snow)}
.greet .l2{color:var(--gold);font-weight:700}
.greet .tag{display:inline-block;margin-top:10px;font-size:12px;letter-spacing:.12em;color:var(--muted)}
.bar{position:fixed;left:0;right:0;bottom:0;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 14px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none}
.dots{display:flex;gap:10px;pointer-events:auto}
.dots button{width:12px;height:12px;border-radius:50%;border:1px solid var(--gold);background:transparent;padding:0;cursor:pointer}
.dots button[aria-current="true"]{background:var(--gold);box-shadow:0 0 10px var(--gold)}
.ctrls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;pointer-events:auto}
.ctrls button{font:inherit;font-size:14px;color:var(--snow);background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer}
.ctrls button[aria-pressed="true"]{background:rgba(200,50,60,.55)}
button:focus-visible,.greet:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.hint{font-size:12px;color:var(--muted);letter-spacing:.06em}
.fallback{position:fixed;inset:auto 16px 50% 16px;text-align:center;color:var(--muted)}
</style>

<canvas id="stage" aria-label="泌尿島 3D 動畫：雪中浮島上有腎臟雙峰、輸尿管河、膀胱湖、攝護腺丘與尿道瀑布，聖誕老人駕麋鹿雪橇盤旋"></canvas>

<header class="top">
  <div class="brand">
    <h1>泌尿<span>島</span></h1>
    <p>Urology Island · Merry Christmas 2026</p>
  </div>
  <div class="stamp">泌尿科聖誕特輯</div>
</header>

<div class="greet show" id="greet" role="button" tabindex="0" aria-live="polite" aria-label="下一則祝福">
  <span class="em" id="gEm">🎅</span>
  <p class="l1" id="gL1">聖誕老人走煙囪，</p>
  <p class="l2" id="gL2">祝你尿路一路通！</p>
  <span class="tag" id="gTag">1 / 5 · 點我看下一則</span>
</div>

<nav class="bar">
  <div class="dots" id="dots"></div>
  <div class="ctrls">
    <button id="btnSpin" aria-pressed="true">暫停旋轉</button>
    <button id="btnMusic" aria-pressed="false">播放鈴聲</button>
  </div>
  <div class="hint">拖曳旋轉 · 雙指縮放</div>
</nav>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
/* ---------- Greetings ---------- */
const GREETS=[
  ['🎅','聖誕老人走煙囪，','祝你尿路一路通！'],
  ['🎄','耶誕大餐有滋味，','結石別來湊一咖！'],
  ['🦌','紅鼻麋鹿來報到，','急尿頻尿都放掉！'],
  ['🎁','今年交換禮物，','明年不換尿布！'],
  ['🌟','天增歲月人增壽，','攝護腺不會年年增！']
];
const greet=document.getElementById('greet'),gEm=document.getElementById('gEm'),gL1=document.getElementById('gL1'),gL2=document.getElementById('gL2'),gTag=document.getElementById('gTag'),dots=document.getElementById('dots');
let gi=0,gTimer=null;
GREETS.forEach((g,i)=>{const b=document.createElement('button');b.setAttribute('aria-label','第'+(i+1)+'則祝福');b.onclick=()=>showGreet(i);dots.appendChild(b);});
function paint(i){const g=GREETS[i];gEm.textContent=g[0];gL1.textContent=g[1];gL2.textContent=g[2];gTag.textContent=(i+1)+' / 5 · 點我看下一則';[...dots.children].forEach((d,k)=>d.setAttribute('aria-current',k===i?'true':'false'));}
function showGreet(i){gi=(i+GREETS.length)%GREETS.length;greet.classList.remove('show');clearTimeout(gTimer);setTimeout(()=>{paint(gi);greet.classList.add('show');},450);schedule();}
function schedule(){clearTimeout(gTimer);gTimer=setTimeout(()=>showGreet(gi+1),5600);}
greet.addEventListener('click',()=>showGreet(gi+1));
greet.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();showGreet(gi+1);}});
paint(0);schedule();

if(typeof THREE==='undefined'){const d=document.createElement('p');d.className='fallback';d.textContent='3D 場景載入失敗，請檢查網路後重新整理。';document.body.appendChild(d);return;}

const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
/* ---------- Renderer / scene ---------- */
const canvas=document.getElementById('stage');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x0d2347,45,110);
const camera=new THREE.PerspectiveCamera(45,1,0.1,300);
const controls=new THREE.OrbitControls(camera,canvas);
controls.target.set(0,1.5,0);controls.enableDamping=true;controls.dampingFactor=.07;
controls.autoRotate=!reduce;controls.autoRotateSpeed=.6;controls.minDistance=12;controls.maxDistance=70;controls.maxPolarAngle=1.48;controls.enablePan=false;

scene.add(new THREE.HemisphereLight(0xbcd4ff,0x1c2a44,.65));
const moonLight=new THREE.DirectionalLight(0xd6e4ff,.95);
moonLight.position.set(-14,26,12);moonLight.castShadow=true;
moonLight.shadow.mapSize.set(1024,1024);
Object.assign(moonLight.shadow.camera,{left:-18,right:18,top:18,bottom:-18,near:1,far:70});
scene.add(moonLight);

const M=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.8,metalness:0},o));
function mesh(geo,mat,x=0,y=0,z=0,parent=scene,shadow=true){const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);if(shadow){m.castShadow=true;m.receiveShadow=true;}parent.add(m);return m;}

/* dot texture for particles */
function dotTex(){const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d');const g=x.createRadialGradient(32,32,0,32,32,32);g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(.35,'rgba(255,255,255,.75)');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(0,0,64,64);return new THREE.CanvasTexture(c);}
const DOT=dotTex();

/* text labels */
function label(text,x,y,z,h=.62,accent='#f2c14e'){
  const c=document.createElement('canvas'),ctx=c.getContext('2d'),fs=54,font='700 '+fs+'px "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif';
  ctx.font=font;const w=Math.ceil(ctx.measureText(text).width)+56,hh=92;c.width=w;c.height=hh;
  ctx.font=font;const r=24;ctx.beginPath();ctx.moveTo(r,3);ctx.lineTo(w-r,3);ctx.quadraticCurveTo(w-3,3,w-3,r);ctx.lineTo(w-3,hh-r);ctx.quadraticCurveTo(w-3,hh-3,w-r,hh-3);ctx.lineTo(r,hh-3);ctx.quadraticCurveTo(3,hh-3,3,hh-r);ctx.lineTo(3,r);ctx.quadraticCurveTo(3,3,r,3);ctx.closePath();
  ctx.fillStyle='rgba(8,20,44,.82)';ctx.fill();ctx.lineWidth=4;ctx.strokeStyle=accent;ctx.stroke();
  ctx.fillStyle='#f3f7ff';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(text,w/2,hh/2+3);
  const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=4;
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true,depthWrite:false}));
  s.scale.set(h*w/hh,h,1);s.position.set(x,y,z);s.renderOrder=5;island.add(s);return s;
}

/* ---------- Sky: stars + moon + snow ---------- */
(function(){const n=700,p=new Float32Array(n*3);for(let i=0;i<n;i++){const u=Math.random()*Math.PI*2,v=Math.acos(Math.random()*.9+.1*0),r=120;p[i*3]=r*Math.sin(v)*Math.cos(u);p[i*3+1]=Math.abs(r*Math.cos(v))*.9+5;p[i*3+2]=r*Math.sin(v)*Math.sin(u);}
const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(p,3));scene.add(new THREE.Points(g,new THREE.PointsMaterial({size:1.1,map:DOT,transparent:true,depthWrite:false,color:0xfff6dd,fog:false})));})();
const moon=mesh(new THREE.SphereGeometry(5,32,32),new THREE.MeshBasicMaterial({color:0xfff3c8,fog:false}),-45,40,-75,scene,false);
const halo=new THREE.Sprite(new THREE.SpriteMaterial({map:DOT,color:0xffe9a8,transparent:true,opacity:.45,depthWrite:false,fog:false}));halo.scale.set(30,30,1);halo.position.copy(moon.position);scene.add(halo);

const SN=1400,snowPos=new Float32Array(SN*3),snowSpd=new Float32Array(SN);
for(let i=0;i<SN;i++){snowPos[i*3]=(Math.random()-.5)*60;snowPos[i*3+1]=Math.random()*40-12;snowPos[i*3+2]=(Math.random()-.5)*60;snowSpd[i]=.6+Math.random()*1.2;}
const snowGeo=new THREE.BufferGeometry();snowGeo.setAttribute('position',new THREE.BufferAttribute(snowPos,3));
scene.add(new THREE.Points(snowGeo,new THREE.PointsMaterial({size:.22,map:DOT,transparent:true,depthWrite:false,color:0xffffff})));

/* ---------- Island ---------- */
const island=new THREE.Group();scene.add(island);
const snowMat=M(0xf3f7ff,{roughness:.95});
mesh(new THREE.CylinderGeometry(10,9.8,.5,72),snowMat,0,.35,0,island);
mesh(new THREE.CylinderGeometry(9.8,9.2,.8,72),M(0x6b4a33),0,-.3,0,island);
(function(){const g=new THREE.ConeGeometry(9.2,10,30,7);g.rotateX(Math.PI);const a=g.attributes.position;
  const h=(x,y,z)=>{const s=Math.sin(Math.round(x*50)*12.9898+Math.round(y*50)*78.233+Math.round(z*50)*37.719)*43758.5453;return s-Math.floor(s);};
  for(let i=0;i<a.count;i++){const x=a.getX(i),y=a.getY(i),z=a.getZ(i);if(y>4.9)continue;const k=.75+h(x,y,z)*.5;a.setXYZ(i,x*k,y+(h(z,x,y)-.5)*.8,z*k);}
  g.computeVertexNormals();mesh(g,M(0x4d5a73,{flatShading:true,roughness:1}),0,-5.7,0,island);})();
const iceMat=M(0xcfe8ff,{roughness:.2,metalness:.1,transparent:true,opacity:.85});
for(let i=0;i<70;i++){const a=i/70*Math.PI*2+Math.random()*.04,len=.3+Math.random()*.9,c=mesh(new THREE.ConeGeometry(.09,len,5),iceMat,Math.cos(a)*9.75,.1-len/2,Math.sin(a)*9.75,island,false);c.rotation.x=Math.PI;}
for(let i=0;i<26;i++){const a=Math.random()*Math.PI*2,r=6.8+Math.random()*2.6,x=Math.cos(a)*r,z=Math.sin(a)*r;if(z>0&&Math.abs(x)<1.6)continue;const m=mesh(new THREE.SphereGeometry(.3+Math.random()*.5,14,10),snowMat,x,.6,z,island);m.scale.y=.35;}

/* Kidneys: twin standing beans with Santa-hat adrenals */
const kidMat=M(0x9b3a3f,{roughness:.55,metalness:.05});
function kidney(x,gapAngle){
  const g=new THREE.Group();g.position.set(x,2.35,-4.5);island.add(g);
  const k=mesh(new THREE.TorusGeometry(1.0,.86,22,44,Math.PI*1.25),kidMat,0,0,0,g);k.rotation.z=gapAngle-Math.PI*1.625;
  const hat=new THREE.Group();hat.position.set(0,1.72,0);hat.rotation.z=-Math.sign(x)*.35;g.add(hat);
  mesh(new THREE.ConeGeometry(.52,1.05,20),M(0xc8323c,{roughness:.6}),0,.55,0,hat);
  const brim=mesh(new THREE.TorusGeometry(.5,.13,10,24),snowMat,0,.03,0,hat);brim.rotation.x=Math.PI/2;
  mesh(new THREE.SphereGeometry(.17,12,10),snowMat,0,1.1,0,hat);
  return g;
}
kidney(-3,0);kidney(3,Math.PI);
label('腎臟雙峰',0,5.3,-4.5,.7);
label('腎上腺戴聖誕帽',0,4.55,-4.5,.48,'#c8323c');

/* Ureters, bladder lake, prostate, urethra */
const waterMat=M(0x7fd3ff,{roughness:.15,metalness:.1,emissive:0x0b3a5c,transparent:true,opacity:.85});
const V=(x,y,z)=>new THREE.Vector3(x,y,z);
const curves=[
  new THREE.CatmullRomCurve3([V(-2.25,2.1,-4.5),V(-2.0,1.0,-4.2),V(-1.8,.66,-3.0),V(-1.3,.66,-1.0),V(-.9,.66,.4),V(-.5,.66,1.0)]),
  new THREE.CatmullRomCurve3([V(2.25,2.1,-4.5),V(2.0,1.0,-4.2),V(1.8,.66,-3.0),V(1.3,.66,-1.0),V(.9,.66,.4),V(.5,.66,1.0)]),
  new THREE.CatmullRomCurve3([V(0,.66,2.6),V(0,.66,3.6),V(0,.7,4.3),V(0,.66,5.6),V(.35,.66,7.4),V(0,.66,9.4),V(0,.45,10.05)])
];
curves.forEach(c=>mesh(new THREE.TubeGeometry(c,80,.14,10,false),waterMat,0,0,0,island,false));
mesh(new THREE.CylinderGeometry(1.75,1.75,.08,48),M(0x6cc6f5,{roughness:.08,metalness:.2,emissive:0x0a3352}),0,.63,1.6,island,false);
const rim=mesh(new THREE.TorusGeometry(1.8,.16,10,48),snowMat,0,.62,1.6,island);rim.rotation.x=Math.PI/2;
const prost=mesh(new THREE.SphereGeometry(1,28,20),M(0xc98b5e,{roughness:.7}),0,.6,4.3,island);prost.scale.set(1.15,.62,.85);
label('輸尿管河（蠕動中）',-3.4,1.6,-1.6,.5);
label('膀胱湖 · 容量 400 mL',0,1.55,1.6,.55);
label('攝護腺丘 · 20 g 不增生',0,1.75,4.3,.52);
label('尿道瀑布 · 一路通',0,1.25,8.8,.52);
/* peristalsis droplets */
const dropMat=new THREE.MeshStandardMaterial({color:0xfff1a6,emissive:0x8a6a10,roughness:.3});
const drops=[];curves.forEach((c,ci)=>{for(let i=0;i<7;i++){const m=mesh(new THREE.SphereGeometry(.17,10,8),dropMat,0,0,0,island,false);drops.push({m,c,o:i/7,s:ci===2?.16:.11});}});
/* No-stones sign */
(function(){const g=new THREE.Group();g.position.set(-4.4,.6,-1.2);island.add(g);
  mesh(new THREE.CylinderGeometry(.06,.06,1.6,8),M(0x6b4a33),0,.8,0,g);
  const d=mesh(new THREE.CylinderGeometry(.5,.5,.06,28),M(0xffffff),0,1.7,0,g);d.rotation.x=Math.PI/2;
  const ring=mesh(new THREE.TorusGeometry(.48,.07,8,28),M(0xc8323c),0,1.7,.04,g);
  const sl=mesh(new THREE.BoxGeometry(.9,.1,.05),M(0xc8323c),0,1.7,.06,g);sl.rotation.z=Math.PI/4;
  const st=mesh(new THREE.DodecahedronGeometry(.18),M(0x9b8f74,{flatShading:true}),0,1.7,.02,g);
  for(let i=0;i<4;i++)mesh(new THREE.DodecahedronGeometry(.12+Math.random()*.1),M(0x8f8570,{flatShading:true}),.5+Math.random()*.6,.68,Math.random()*.6-.3,g);
  label('結石禁止進入',-4.4,3.0,-1.2,.5,'#c8323c');})();

/* Christmas tree */
const lights=[];
(function(){const g=new THREE.Group();g.position.set(5.6,.6,.6);island.add(g);
  mesh(new THREE.CylinderGeometry(.3,.38,1,10),M(0x5a3a22),0,.5,0,g);
  const pm=M(0x1f6b3a,{roughness:.85});[[2.3,2.2,1.7],[1.8,1.9,2.9],[1.25,1.6,4.0]].forEach(([r,h,y])=>mesh(new THREE.ConeGeometry(r,h,18),pm,0,y,0,g));
  const cols=[0xff4d4d,0xf2c14e,0x6cd3ff,0xff8ad8,0x9dff8a];
  for(let i=0;i<34;i++){const t=i/34,y=1.1+t*3.6,r=(2.2-t*1.8)*.92,a=i*2.4;const mat=new THREE.MeshStandardMaterial({color:cols[i%5],emissive:cols[i%5],emissiveIntensity:.9,roughness:.3});lights.push(mesh(new THREE.SphereGeometry(.11,10,8),mat,Math.cos(a)*r,y,Math.sin(a)*r,g,false));}
  const s=new THREE.Shape();for(let i=0;i<10;i++){const r=i%2?.22:.5,a=i/10*Math.PI*2+Math.PI/2;i?s.lineTo(Math.cos(a)*r,Math.sin(a)*r):s.moveTo(Math.cos(a)*r,Math.sin(a)*r);}
  const star=mesh(new THREE.ExtrudeGeometry(s,{depth:.14,bevelEnabled:false}),new THREE.MeshStandardMaterial({color:0xffd75e,emissive:0xffb800,emissiveIntensity:1.2}),0,5.2,-.07,g,false);star.name='star';g.userData.star=star;
  const pl=new THREE.PointLight(0xffd27a,1.1,9);pl.position.set(0,5.2,.6);g.add(pl);
  window.__tree=g;
  /* gifts */
  [[-1.4,1.6,0xc8323c,0xf2c14e,.7],[.2,2.2,0x2f8f5b,0xf3f7ff,.55],[-2.2,.3,0x3a6fd8,0xf2c14e,.5],[1.5,1.4,0xf2c14e,0xc8323c,.6]].forEach(([x,z,c,rb,s])=>{const b=new THREE.Group();b.position.set(x,s/2,z);b.rotation.y=Math.random();g.add(b);mesh(new THREE.BoxGeometry(s,s,s),M(c,{roughness:.5}),0,0,0,b);mesh(new THREE.BoxGeometry(s*1.02,s*1.02,s*.16),M(rb,{roughness:.4}),0,0,0,b,false);mesh(new THREE.BoxGeometry(s*.16,s*1.02,s*1.02),M(rb,{roughness:.4}),0,0,0,b,false);});
  label('今年交換禮物',5.0,.6+6.1,.6,.55);
  label('明年不換尿布',4.2,2.2,3.2,.5,'#2f8f5b');})();

/* House with chimney */
const smoke=[];
(function(){const g=new THREE.Group();g.position.set(-5.8,.6,1.6);g.rotation.y=.5;island.add(g);
  mesh(new THREE.BoxGeometry(2.6,1.8,2.1),M(0x8a5233,{roughness:.9}),0,.9,0,g);
  const rg=new THREE.CylinderGeometry(1.75,1.75,2.9,3,1,false,Math.PI/2);rg.rotateZ(Math.PI/2);mesh(rg,M(0xb52a33,{roughness:.6}),0,2.55,0,g);
